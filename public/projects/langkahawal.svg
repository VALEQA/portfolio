<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="phoneCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Background Decorative Water Wave Circles -->
  <circle cx="700" cy="80" r="140" fill="#38bdf8" opacity="0.12" />
  <circle cx="100" cy="420" r="180" fill="#38bdf8" opacity="0.08" />

  <!-- Left Side: App Feature Highlights -->
  <g transform="translate(60, 90)">
    <!-- Badge -->
    <rect width="168" height="28" rx="14" fill="#fde047" stroke="#0f172a" stroke-width="1.5" />
    <text x="14" y="18" fill="#0f172a" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900">FLUTTER &amp; FIREBASE</text>

    <!-- Title -->
    <text x="0" y="65" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800">LangkahAwal</text>
    <text x="0" y="92" fill="#7dd3fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">Child Milestone &amp; Growth Tracker</text>

    <!-- Feature Bullet 1 -->
    <g transform="translate(0, 130)">
      <circle cx="12" cy="12" r="10" fill="#38bdf8" />
      <path d="M8 12 L11 15 L16 9" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="32" y="12" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Pelacakan Milestone Balita</text>
      <text x="32" y="27" fill="#bae6fd" font-family="sans-serif" font-size="11">Motorik kasar, halus &amp; bahasa</text>
    </g>

    <!-- Feature Bullet 2 -->
    <g transform="translate(0, 185)">
      <circle cx="12" cy="12" r="10" fill="#fde047" />
      <path d="M8 12 L11 15 L16 9" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="32" y="12" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Sinkronisasi Cloud Real-Time</text>
      <text x="32" y="27" fill="#bae6fd" font-family="sans-serif" font-size="11">Data Firestore multi-perangkat</text>
    </g>

    <!-- Feature Bullet 3 -->
    <g transform="translate(0, 240)">
      <circle cx="12" cy="12" r="10" fill="#4ade80" />
      <path d="M8 12 L11 15 L16 9" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="32" y="12" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Manajemen Profil Anak</text>
      <text x="32" y="27" fill="#bae6fd" font-family="sans-serif" font-size="11">Jadwal imunisasi &amp; kurva tumbuh</text>
    </g>
  </g>

  <!-- Right Side: Realistic Phone Mockup -->
  <g transform="translate(480, 45)" filter="url(#shadow)">
    <!-- Phone Outer Body -->
    <rect width="250" height="420" rx="34" fill="#0f172a" stroke="#334155" stroke-width="3" />

    <!-- Phone Screen Inner -->
    <rect x="8" y="8" width="234" height="404" rx="28" fill="#f8fafc" />

    <!-- Dynamic Island / Speaker Notch -->
    <rect x="95" y="16" width="60" height="14" rx="7" fill="#0f172a" />

    <!-- App Header Inside Screen -->
    <g transform="translate(24, 42)">
      <text x="0" y="16" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">LangkahAwal</text>
      <circle cx="195" cy="12" r="14" fill="#e0f2fe" />
      <text x="195" y="16" fill="#0284c7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">👶</text>
    </g>

    <!-- Child Profile Card -->
    <g transform="translate(20, 75)">
      <rect width="210" height="74" rx="16" fill="url(#phoneCardGrad)" />
      <circle cx="34" cy="37" r="20" fill="#ffffff" />
      <text x="34" y="42" fill="#0284c7" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">👶</text>
      <text x="64" y="30" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Sakha Yusuf</text>
      <text x="64" y="47" fill="#e0f2fe" font-family="sans-serif" font-size="10" font-weight="600">Usia: 10 Bulan • Aktif</text>
      <rect x="64" y="54" width="70" height="12" rx="6" fill="#fde047" />
      <text x="99" y="63" fill="#0f172a" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">FASE TUMBUH</text>
    </g>

    <!-- Milestone Progress Card -->
    <g transform="translate(20, 160)">
      <rect width="210" height="110" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="14" y="22" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Capaian Milestone</text>
      <text x="196" y="22" fill="#0284c7" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="end">85%</text>

      <!-- Progress bar -->
      <rect x="14" y="32" width="182" height="6" rx="3" fill="#e2e8f0" />
      <rect x="14" y="32" width="154" height="6" rx="3" fill="#0284c7" />

      <!-- Checklist Items -->
      <g transform="translate(14, 52)">
        <circle cx="6" cy="6" r="6" fill="#dcfce7" />
        <path d="M4 6 L5.5 7.5 L8 4.5" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" fill="none" />
        <text x="18" y="9" fill="#334155" font-family="sans-serif" font-size="9" font-weight="600">Berdiri berpegangan meja</text>
      </g>

      <g transform="translate(14, 72)">
        <circle cx="6" cy="6" r="6" fill="#dcfce7" />
        <path d="M4 6 L5.5 7.5 L8 4.5" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" fill="none" />
        <text x="18" y="9" fill="#334155" font-family="sans-serif" font-size="9" font-weight="600">Merespons panggilan nama</text>
      </g>

      <g transform="translate(14, 92)">
        <circle cx="6" cy="6" r="6" fill="#fef9c3" />
        <path d="M6 3 L6 7 M6 9 L6 9.5" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" fill="none" />
        <text x="18" y="9" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="500">Mulai melangkah mandiri</text>
      </g>
    </g>

    <!-- Mini Chart Card -->
    <g transform="translate(20, 280)">
      <rect width="210" height="85" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="14" y="20" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Grafik Tumbuh Kembang</text>
      <text x="196" y="20" fill="#16a34a" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="end">+0.6 kg/bln</text>

      <!-- Sparkline Area -->
      <path d="M 16 65 Q 60 55, 90 48 T 150 38 T 194 30 L 194 72 L 16 72 Z" fill="url(#chartGrad)" />
      <path d="M 16 65 Q 60 55, 90 48 T 150 38 T 194 30" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <circle cx="194" cy="30" r="4" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Bottom Navigation Bar inside Screen -->
    <g transform="translate(20, 375)">
      <rect width="210" height="26" rx="8" fill="#f1f5f9" />
      <text x="35" y="16" fill="#0284c7" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Beranda</text>
      <text x="105" y="16" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="500" text-anchor="middle">Milestone</text>
      <text x="175" y="16" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="500" text-anchor="middle">Profil</text>
    </g>
  </g>
</svg>